apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: obs-manju
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-admin
subjects:
- kind: ServiceAccount
  name: github-actions
  namespace: obs-manju
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io