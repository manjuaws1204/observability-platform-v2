name: Observability CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate:

    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Verify Runner
        shell: powershell
        run: |
          kubectl get nodes
          kubectl get ns

      - name: Validate Kubernetes Manifests
        shell: powershell
        run: |
          .\scripts\validate.ps1